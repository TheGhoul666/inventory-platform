services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: transport
      POSTGRES_PASSWORD: transport
      POSTGRES_DB: transport_ai
    ports: ["5432:5432"]
    volumes: ["db_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transport"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: ./app/backend
    environment:
      DATABASE_URL: postgresql://transport:transport@db:5432/transport_ai
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: python:3.12-slim
    working_dir: /site
    volumes: ["./app/frontend:/site"]
    command: python -m http.server 5173
    ports: ["5173:5173"]

volumes:
  db_data:
