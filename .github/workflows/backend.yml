name: Backend CI

on:
  push:
    branches: [main, develop]
    paths: [backend/**, database/**]
  pull_request:
    branches: [main]
    paths: [backend/**]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: test_inventory
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check app/ && mypy app/ --ignore-missing-imports
      - name: Unit tests
        run: pytest tests/unit/ -v --cov=app --cov-report=xml
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_pass@localhost:5432/test_inventory
          APP_SECRET_KEY: test-secret-key-32-chars-minimum!!
          APP_ENV: test
      - uses: codecov/codecov-action@v4

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        run: echo "Deploy via your chosen platform (Railway, Fly.io, ECS, etc.)"
        # Replace with actual deployment step
